services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - catraca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: catraca-app:latest
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://catraca:catraca@postgres:5432/catraca
      REDIS_URL: redis://redis:6379
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: catraca-app:latest
    build: .
    command: ["npx", "tsx", "src/worker/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://catraca:catraca@postgres:5432/catraca
      REDIS_URL: redis://redis:6379
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  catraca_pgdata:
